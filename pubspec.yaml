  nigerian_states_and_lga: ^1.0.0
  smooth_page_indicator: ^1.2.0+3
  country_code_picker: ^3.1.0
  country_picker: ^2.0.27
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.3
  pin_code_fields: ^8.0.1
  flutter_toggle_tab: ^1.5.1
  confetti: ^0.8.0
  shared_preferences: ^2.5.2
