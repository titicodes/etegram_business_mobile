name: etegram_business
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.6.0


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  get_it: ^8.0.3
  flutter_svg: ^2.0.17
  provider: ^6.1.2
  flutter_dotenv: ^5.2.1
  flutter_screenutil: ^5.9.3
  dio: ^5.7.0
  carousel_slider: ^5.0.0
  animated_splash_screen: ^1.3.0
  intl: ^0.20.1
  flutter_shimmer: ^2.1.2
  get_storage: ^2.1.1
  http: ^1.2.2
  clipboard: ^0.1.3
  http_parser: ^4.1.2
  permission_handler: ^11.3.1
  flutter_smart_dialog: ^4.9.8+5
  flutter_secure_storage: ^9.2.4
  oktoast: ^3.4.0
  intl_phone_number_input: ^0.7.4
  iconsax: ^0.0.8
  flutter_native_contact_picker: ^0.0.10
  url_launcher: ^6.3.1
  flutter_spinkit: ^5.2.1
  nigerian_states_and_lga: ^1.0.0
  smooth_page_indicator: ^1.2.0+3
  country_code_picker: ^3.1.0
  country_picker: ^2.0.27
  image_picker: ^1.1.2
  mobile_scanner: ^6.0.3
  pin_code_fields: ^8.0.1
  flutter_toggle_tab: ^1.5.1
  confetti: ^0.8.0
  shared_preferences: ^2.5.2
  line_awesome_flutter: ^3.0.1
  camera: ^0.11.1
  google_mlkit_barcode_scanning: ^0.14.1




dev_dependencies:
  flutter_test:
    sdk: flutter

  change_app_package_name: ^1.4.0

  flutter_lints: ^5.0.0

flutter:

  uses-material-design: true


  assets:
     - assets/images/
     - assets/svgs/
     - assets/wards.json
     - assets/nigeria_states.json
     - assets/nigerian-banks.json


  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Thin.ttf
          weight: 100
        - asset: assets/fonts/Poppins-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/Poppins-ExtraLight.ttf
          weight: 200
        - asset: assets/fonts/Poppins-ExtraLightItalic.ttf
          weight: 200
          style: italic
        - asset: assets/fonts/Poppins-Light.ttf
          weight: 300
        - asset: assets/fonts/Poppins-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-RegularItalic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-SemiBoldItalic.ttf
          weight: 600
          style: italic
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/Poppins-ExtraBold.ttf
          weight: 800
        - asset: assets/fonts/Poppins-ExtraBoldItalic.ttf
          weight: 800
          style: italic
        - asset: assets/fonts/Poppins-Black.ttf
          weight: 900
        - asset: assets/fonts/Poppins-BlackItalic.ttf
          weight: 900
          style: italic

    - family: Muge
      fonts:
        - asset: assets/fonts/MugeRegular.ttf

